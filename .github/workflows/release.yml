name: End-to-End Automated Firmware and Manifest Sync

on:
  push:
    paths:
      - 'firmware/manifest.json' # Triggers automatically on any code push/edit

  # Adds the dropdown selection menu and text inputs on the GitHub web UI
  workflow_dispatch:
    inputs:
      target_preset:
        description: 'Select Build Preset Target'
        required: true
        default: 'GitHub-Cloud'
        type: environment # Links dropdown choices to GitHub Environments
      manual_version:
        description: 'New Version (leave blank to use existing manifest version)'
        required: false
        type: string
      manual_changelog:
        description: 'Release Notes / Changelog (leave blank to keep existing)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-sync-release:
    # Links the run to your selected environment preset (defaults to Cloud if pushed)
    environment: ${{ github.event.inputs.target_preset || 'GitHub-Cloud' }}
    
    # Route to local Pi 5 if chosen, otherwise use GitHub Cloud runners
    runs-on: ${{ (github.event.inputs.target_preset == 'Local-Pi5') && 'self-hosted' || 'ubuntu-latest' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensures proper history tracking for committing updates back

      # v2 (2026-07-25): catches exactly the failure seen this session — a
      # hand-edit to manifest.json (usually an unescaped " in the changelog
      # text) left it invalid JSON, which wasn't caught until the "Update
      # Manifest" step ~10+ minutes into the run, after a full compile had
      # already completed. This validates BEFORE any build work starts, so
      # a bad manifest fails in seconds with a clear message instead of
      # burning a full build first. Does not touch the compile/build steps
      # below at all — purely an early guard rail.
      - name: Validate manifest.json
        run: |
          python3 -c "
          import json, sys
          path = 'firmware/manifest.json'
          try:
              with open(path) as f:
                  json.load(f)
              print(f'{path} is valid JSON.')
          except json.JSONDecodeError as e:
              print(f'::error::{path} is not valid JSON: {e}')
              print('Tip: a manual edit likely left an unescaped \" or a raw newline inside a string value (e.g. the changelog field).')
              print('Prefer editing via workflow_dispatch -> manual_changelog instead of hand-editing the file directly -- that path escapes it for you.')
              sys.exit(1)
          "

      # Nothing anywhere previously cross-checked that manifest.json's target
      # version actually matches the .ino's compiled-in FW_VERSION. If they
      # drift (e.g. manifest bumped to 5.60 but FW_VERSION left at 5.59), the
      # released binary reports 5.59 internally forever, while the manifest
      # keeps claiming 5.60 -- devices see otaNewVersion never equal their own
      # FW_VERSION even right after a "successful" update, and can loop
      # thinking an update is perpetually available. Uses manual_version if
      # this run was triggered with one (workflow_dispatch), matching exactly
      # what the later "Update Manifest" step will actually write.
      - name: Verify FW_VERSION matches manifest target version
        env:
          MANUAL_VERSION: ${{ github.event.inputs.manual_version }}
        run: |
          python3 -c "
          import json, re, os, sys

          with open('firmware/manifest.json') as f:
              data = json.load(f)

          manual_version = os.environ.get('MANUAL_VERSION', '').strip()
          target_version = manual_version if manual_version else data.get('version', '')

          ino_files = [l for l in os.popen('find . -name \"*.ino\"').read().splitlines()]
          if not ino_files:
              print('::error::No .ino file found in repo.')
              sys.exit(1)
          with open(ino_files[0]) as f:
              ino_src = f.read()

          m = re.search(r'#define\s+FW_VERSION\s+\"([\d.]+)\"', ino_src)
          if not m:
              print(f'::error::Could not find FW_VERSION define in {ino_files[0]}')
              sys.exit(1)
          fw_version = m.group(1)

          print(f'Target manifest version : {target_version}')
          print(f'.ino FW_VERSION         : {fw_version}')

          if target_version != fw_version:
              print(f'::error::Version mismatch -- manifest will say v{target_version} but the .ino compiles as v{fw_version}. Bump FW_VERSION in the .ino (and push) to match before releasing.')
              sys.exit(1)

          print('Versions match.')
          "

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install ESP32 Core Package
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
          arduino-cli core update-index
          # PINNED: matches locally installed/tested esp32 core version
          # (esp32 by espressif systems, via Boards Manager)
          arduino-cli core install esp32:esp32@3.3.10

      - name: Install System Dependencies & Custom Libraries
        run: |
          mkdir -p $HOME/Arduino/libraries

          # PINNED to a release tag, not the default branch. Previously this
          # block did `git pull` on every re-run when the checkout already
          # existed (only relevant on the self-hosted Local-Pi5 runner, since
          # GitHub-hosted runners always start from a clean filesystem) --
          # that silently moved WiFiManager forward on every retrigger with
          # no corresponding commit in this repo to explain why a build
          # started failing. Always re-clone at a known tag instead.
          rm -rf "$HOME/Arduino/libraries/WiFiManager"
          git clone --branch v2.0.17 --depth 1 https://github.com/tzapu/WiFiManager.git "$HOME/Arduino/libraries/WiFiManager"

          # PINNED: matches locally installed/tested versions (Arduino IDE ->
          # Sketch -> Include Library -> Manage Libraries)
          arduino-cli lib install "Heltec ESP32 Dev-Boards@2.1.6"
          arduino-cli lib install "PubSubClient@2.8"
          arduino-cli lib install "DHT sensor library@1.4.7"
          arduino-cli lib install "Adafruit Unified Sensor@1.1.15"
          arduino-cli lib install "ArduinoJson@7.4.3"
          arduino-cli lib install "OneButton@2.6.2"
          arduino-cli lib install "JLed@4.15.0"

      - name: Compile Heltec V2 Binary
        run: |
          SKETCH_DIR=$(dirname $(find . -name "*.ino" | head -n 1))
          
          # Target Heltec board with partition overrides to bypass core validation
          arduino-cli compile \
            --fqbn esp32:esp32:heltec_wifi_kit_32 \
            --build-property "build.partitions=partitions" \
            --build-property "upload.maximum_size=1966080" \
            --output-dir ./build "$SKETCH_DIR"

      - name: Update Manifest, Rename Binary, and Calculate CRC32
        id: process_artifacts
        env:
          GITHUB_REPO: ${{ github.repository }}
          MANUAL_VERSION: ${{ github.event.inputs.manual_version }}
          MANUAL_CHANGELOG: ${{ github.event.inputs.manual_changelog }}
        run: |
          MANIFEST_PATH="firmware/manifest.json"
          
          # 1. Parse target version (Use manual text input if provided, otherwise fallback to manifest)
          if [ -n "$MANUAL_VERSION" ]; then
            VERSION="$MANUAL_VERSION"
            echo "Using manually inputted version: $VERSION"
          else
            VERSION=$(python3 -c "import json; print(json.load(open('$MANIFEST_PATH'))['version'])")
            echo "Using existing manifest version: $VERSION"
          fi
          
          # 2. Grab the actual binary output and calculate its true CRC32 checksum
          TARGET_BIN=$(ls ./build/*.bin | grep -v "bootloader" | grep -v "partitions" | head -n 1)
          
          # Compute size in bytes (what manifest.json / the firmware expect —
          # see the .ino's own manifest-format comment: "size":1048576) and
          # a KB value purely for readability in this step's own log output.
          SIZE_BYTES=$(stat -c%s "$TARGET_BIN")
          SIZE_KB=$(python3 -c "print(round($SIZE_BYTES / 1024, 1))")
          echo "Binary size: $SIZE_BYTES bytes (~${SIZE_KB} KB)"
          
          # Compute CRC32
          CRC32=$(python3 -c "import zlib; print(f'{zlib.crc32(open(\"$TARGET_BIN\", \"rb\").read()):08X}')")
          echo "Computed Binary CRC32: $CRC32"
          
          # 3. Format the exact expected binary asset name matching your scheme
          NEW_NAME="heltec_wifkit32v2_v${VERSION//./}_${CRC32}_firmware.ino.bin"
          mv "$TARGET_BIN" "./build/$NEW_NAME"
          
          # 4. Export context parameters to the local environment context for Python injection
          export D_VERSION="$VERSION"
          export D_NAME="$NEW_NAME"
          export D_SIZE_BYTES="$SIZE_BYTES"
          export D_CRC32="$CRC32"
          export D_CHANGELOG="$MANUAL_CHANGELOG"
          
          python3 -c "
          import json
          import os
          from datetime import datetime, timezone
          
          with open('$MANIFEST_PATH', 'r') as f:
              data = json.load(f)
          
          # Safely inject/update parameters
          data['version'] = os.environ['D_VERSION']
          data['build_date'] = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          data['binary'] = f'https://github.com/' + os.environ['GITHUB_REPO'] + f'/releases/download/v' + os.environ['D_VERSION'] + '/' + os.environ['D_NAME']
          # v2 (2026-07-25): was writing KB as a float ('size': 1420.5) — the
          # firmware's own manifest-format comment documents this field as
          # raw bytes ('size':1048576), and doc[\"size\"] | (uint32_t)0 in
          # ArduinoJson can't coerce a JSON float into the requested uint32_t,
          # so it silently fell back to the 0 default. Every device that
          # parsed a manifest written the old way saw \"Size: 0KB\".
          data['size'] = int(os.environ['D_SIZE_BYTES'])
          data['crc32'] = os.environ['D_CRC32']
          
          # Update the changelog block if text was inputted manually
          if os.environ.get('D_CHANGELOG'):
              data['changelog'] = os.environ['D_CHANGELOG']
          
          with open('$MANIFEST_PATH', 'w') as f:
              json.dump(data, f, indent=2)
          "
          
          # 5. Export values to environment steps
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "filename=$NEW_NAME" >> $GITHUB_OUTPUT

      - name: Commit Updated Manifest Back to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add firmware/manifest.json
          # Only commit if changes exist to prevent empty run loops. [skip ci] prevents triggering cloud push builds.
          git diff-index --quiet HEAD || git commit -m "chore: automated manifest update for v${{ steps.process_artifacts.outputs.version }} [skip ci]"
          # Pull any changes that happened remotely during the compilation process
          git pull --rebase origin main

          git push origin main

      - name: Generate Automated GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.process_artifacts.outputs.version }}"
          name: "Release v${{ steps.process_artifacts.outputs.version }}"
          body: "Automated firmware deployment build. Embedded system binaries attached."
          files: "build/${{ steps.process_artifacts.outputs.filename }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}