name: End-to-End Automated Firmware and Manifest Sync

on:
  push:
    paths:
      - 'firmware/manifest.json'  # Triggers automatically when you push a manifest update
  
  workflow_dispatch:              # Allows manual triggers with a choice selection layout
    inputs:
      runner_selection:
        description: 'Choose Execution Environment'
        required: true
        default: 'auto-detect'
        type: choice
        options:
          - 'auto-detect'
          - 'force-local-pi5'
          - 'force-github-cloud'

permissions:
  contents: write

jobs:
  # STEP 1: Smart Routing Engine (Determines if the Pi is alive)
  determine-runner:
    runs-on: ubuntu-latest
    outputs:
      target_runner: ${{ steps.decide.outputs.final_choice }}
    steps:
      - name: Evaluate Network Status & User Choice
        id: decide
        env:
          CHOICE: ${{ github.event.inputs.runner_selection || 'auto-detect' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "User Selection Mode: $CHOICE"
          
          if [ "$CHOICE" = "force-github-cloud" ]; then
            echo "Forcing build onto GitHub Cloud Runners."
            echo "final_choice=ubuntu-latest" >> $GITHUB_OUTPUT
            
          elif [ "$CHOICE" = "force-local-pi5" ]; then
            echo "Forcing build onto Local Self-Hosted Raspberry Pi 5."
            echo "final_choice=self-hosted" >> $GITHUB_OUTPUT
            
          else
            # AUTO-DETECT MODE: Query GitHub API to see if your Pi 5 runner is active/idle
            echo "Auto-detect active. Checking API for available self-hosted runners..."
            
            RUNNER_STATUS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runners" \
              | python3 -c "
import sys, json
try:
    data = json.load(sys.stdin)
    # Find any self-hosted runner that is active and online
    online_runners = [r for r in data.get('runners', []) if 'self-hosted' in r.get('labels', []) and r.get('status') == 'online']
    print('online' if online_runners else 'offline')
except Exception:
    print('offline')
")
            
            if [ "$RUNNER_STATUS" = "online" ]; then
              echo "🚀 Raspberry Pi 5 is ONLINE! Routing compilation locally."
              echo "final_choice=self-hosted" >> $GITHUB_OUTPUT
            else
              echo "⚠️ Raspberry Pi 5 is OFFLINE or unreachable. Falling back to GitHub Cloud Servers."
              echo "final_choice=ubuntu-latest" >> $GITHUB_OUTPUT
            fi
          fi

  # STEP 2: Main Compilation, Sync, and Release Job
  build-sync-release:
    needs: determine-runner
    # FIXED: Wrapped inside the expression context brackets so the compiler reads the evaluated output string!
    runs-on: ${{ needs.determine-runner.outputs.target_runner }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # System Pre-Check: Safely configures the CLI compiler engine on both environments natively
      - name: System Pre-Check & Setup Arduino CLI
        run: |
          if ! command -v arduino-cli &> /dev/null; then
            echo "arduino-cli not found. Installing system binary toolchain..."
            curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
            echo "$HOME/bin" >> $GITHUB_PATH
            export PATH="$PATH:$HOME/bin"
          fi

      - name: Install ESP32 Core Package
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
          arduino-cli core update-index
          # Only downloads the core framework files if they aren't already locally cached
          arduino-cli core list | grep "esp32:esp32" || arduino-cli core install esp32:esp32

      - name: Install System Dependencies & Custom Libraries
        run: |
          mkdir -p $HOME/Arduino/libraries
          
          # Skip cloning WiFiManager if the directory already exists on your Pi's system cache
          if [ ! -d "$HOME/Arduino/libraries/WiFiManager" ]; then
            git clone https://github.com/tzapu/WiFiManager.git $HOME/Arduino/libraries/WiFiManager
          fi
          
          arduino-cli lib install "Heltec ESP32 Dev-Boards"
          arduino-cli lib install "PubSubClient"
          arduino-cli lib install "DHT sensor library"
          arduino-cli lib install "Adafruit Unified Sensor"
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "OneButton"
          arduino-cli lib install "JLed"

      - name: Compile Heltec V2 Binary
        run: |
          SKETCH_DIR=$(dirname $(find . -name "*.ino" | head -n 1))
          
          arduino-cli compile \
            --fqbn esp32:esp32:heltec_wifi_kit_32 \
            --build-property "build.partitions=partitions" \
            --build-property "upload.maximum_size=1966080" \
            --output-dir ./build "$SKETCH_DIR"

      - name: Update Manifest, Rename Binary, and Calculate CRC32
        id: process_artifacts
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          MANIFEST_PATH="firmware/manifest.json"
          
          VERSION=$(python3 -c "import json; print(json.load(open('$MANIFEST_PATH'))['version'])")
          echo "Processing Firmware Version: $VERSION"
          
          TARGET_BIN=$(ls ./build/*.bin | grep -v "bootloader" | grep -v "partitions" | head -n 1)
          
          SIZE_BYTES=$(stat -c%s "$TARGET_BIN")
          SIZE_KB=$(python3 -c "print(round($SIZE_BYTES / 1024, 1))")
          
          CRC32=$(python3 -c "import zlib; print(f'{zlib.crc32(open(\"$TARGET_BIN\", \"rb\").read()):08X}')")
          echo "Computed Binary CRC32: $CRC32"
          
          NEW_NAME="heltec_wifkit32v2_v${VERSION//./}_${CRC32}_firmware.ino.bin"
          mv "$TARGET_BIN" "./build/$NEW_NAME"
          
          export D_VERSION="$VERSION"
          export D_NAME="$NEW_NAME"
          export D_SIZE="$SIZE_KB"
          export D_CRC32="$CRC32"
          
          python3 -c "
          import json
          import os
          from datetime import datetime, timezone
          
          with open('$MANIFEST_PATH', 'r') as f:
              data = json.load(f)
          
          data['build_date'] = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          data['binary'] = f'https://github.com/' + os.environ['GITHUB_REPO'] + f'/releases/download/v' + os.environ['D_VERSION'] + '/' + os.environ['D_NAME']
          data['size'] = float(os.environ['D_SIZE'])
          data['crc32'] = os.environ['D_CRC32']
          
          with open('$MANIFEST_PATH', 'w') as f:
              json.dump(data, f, indent=2)
          "
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "filename=$NEW_NAME" >> $GITHUB_OUTPUT

      - name: Commit Updated Manifest Back to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add firmware/manifest.json
          git diff-index --quiet HEAD || git commit -m "chore: automated manifest update for v${{ steps.process_artifacts.outputs.version }} [skip ci]"
          git push origin main

      - name: Generate Automated GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.process_artifacts.outputs.version }}"
          name: "Release v${{ steps.process_artifacts.outputs.version }}"
          body: "Automated firmware deployment build. Embedded system binaries attached."
          files: "build/${{ steps.process_artifacts.outputs.filename }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}