name: End-to-End Automated Firmware and Manifest Sync

on:
  push:
    paths:
      - 'firmware/manifest.json' # The automation triggers ONLY when you update this manifest file

  # This adds the manual "Run workflow" dropdown menu on your GitHub Actions web page
  workflow_dispatch:
    inputs:
      runner_selection:
        description: 'Where should this build run?'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - 'ubuntu-latest'
          - 'self-hosted'

# Give the workflow permission to write updates back into your repository and create releases
permissions:
  contents: write

jobs:
  build-sync-release:
    # If triggered manually, use your dropdown selection. If triggered by a normal push, default to the cloud runner.
    runs-on: ${{ github.event.inputs.runner_selection || 'ubuntu-latest' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensures proper history tracking for committing updates back

      # STEP A: Safely downloads the compiler if it's missing on the target host machine
      - name: System Pre-Check & Install Arduino CLI
        run: |
          if ! command -v arduino-cli &> /dev/null; then
            echo "arduino-cli not found. Installing native binary toolchain..."
            curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
            # Expose the download folder to the rest of the workflow
            echo "$HOME/bin" >> $GITHUB_PATH
          else
            echo "arduino-cli already present on host environment."
          fi

      # STEP B: Splitting this into its own step forces GitHub to update its environment paths cleanly!
      - name: Initialize Arduino Configuration Engine
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
          arduino-cli core update-index

      - name: Install ESP32 Core Package
        run: |
          # Only downloads the core framework files if they aren't already locally cached
          arduino-cli core list | grep "esp32:esp32" || arduino-cli core install esp32:esp32

      - name: Install System Dependencies & Custom Libraries
        run: |
          mkdir -p $HOME/Arduino/libraries
          
          if [ ! -d "$HOME/Arduino/libraries/WiFiManager" ]; then
            git clone https://github.com/tzapu/WiFiManager.git $HOME/Arduino/libraries/WiFiManager
          fi
          
          arduino-cli lib install "Heltec ESP32 Dev-Boards"
          arduino-cli lib install "PubSubClient"
          arduino-cli lib install "DHT sensor library"
          arduino-cli lib install "Adafruit Unified Sensor"
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "OneButton"
          arduino-cli lib install "JLed"

      - name: Compile Heltec V2 Binary
        run: |
          SKETCH_DIR=$(dirname $(find . -name "*.ino" | head -n 1))
          
          # Target the true Heltec board, but inject custom partition overrides 
          # to bypass the restrictive core menu validation.
          arduino-cli compile \
            --fqbn esp32:esp32:heltec_wifi_kit_32 \
            --build-property "build.partitions=partitions" \
            --build-property "upload.maximum_size=1966080" \
            --output-dir ./build "$SKETCH_DIR"

      - name: Update Manifest, Rename Binary, and Calculate CRC32
        id: process_artifacts
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          MANIFEST_PATH="firmware/manifest.json"
          
          # 1. Parse target version from your initial manifest modification
          VERSION=$(python3 -c "import json; print(json.load(open('$MANIFEST_PATH'))['version'])")
          echo "Processing Firmware Version: $VERSION"
          
          # 2. Grab the actual binary output and calculate its true CRC32 checksum
          TARGET_BIN=$(ls ./build/*.bin | grep -v "bootloader" | grep -v "partitions" | head -n 1)
          
          # Calculate size in KB (bytes / 1024) rounded to 1 decimal place
          SIZE_BYTES=$(stat -c%s "$TARGET_BIN")
          SIZE_KB=$(python3 -c "print(round($SIZE_BYTES / 1024, 1))")
          
          # Compute CRC32
          CRC32=$(python3 -c "import zlib; print(f'{zlib.crc32(open(\"$TARGET_BIN\", \"rb\").read()):08X}')")
          echo "Computed Binary CRC32: $CRC32"
          
          # 3. Format the exact expected binary asset name matching your scheme
          NEW_NAME="heltec_wifkit32v2_v${VERSION//./}_${CRC32}_firmware.ino.bin"
          mv "$TARGET_BIN" "./build/$NEW_NAME"
          
          # 4. Use Python to inject metrics safely into manifest.json by passing variables from the environment context
          export D_VERSION="$VERSION"
          export D_NAME="$NEW_NAME"
          export D_SIZE="$SIZE_KB"
          export D_CRC32="$CRC32"
          
          python3 -c "
          import json
          import os
          from datetime import datetime, timezone
          
          with open('$MANIFEST_PATH', 'r') as f:
              data = json.load(f)
          
          # Injecting/updating the production parameters safely from the environment map
          data['build_date'] = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          data['binary'] = f'https://github.com/' + os.environ['GITHUB_REPO'] + f'/releases/download/v' + os.environ['D_VERSION'] + '/' + os.environ['D_NAME']
          data['size'] = float(os.environ['D_SIZE'])
          data['crc32'] = os.environ['D_CRC32']
          
          with open('$MANIFEST_PATH', 'w') as f:
              json.dump(data, f, indent=2)
          "
          
          # 5. Export values to environment steps
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "filename=$NEW_NAME" >> $GITHUB_OUTPUT

      - name: Commit Updated Manifest Back to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add firmware/manifest.json
          # Only commit if changes exist to prevent empty run loops
          git diff-index --quiet HEAD || git commit -m "chore: automated manifest update for v${{ steps.process_artifacts.outputs.version }} [skip ci]"
          git push origin main

      - name: Generate Automated GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.process_artifacts.outputs.version }}"
          name: "Release v${{ steps.process_artifacts.outputs.version }}"
          body: "Automated firmware deployment build. Embedded system binaries attached."
          files: "build/${{ steps.process_artifacts.outputs.filename }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}